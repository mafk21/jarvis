name: Reliability evaluation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      JARVIS_HUD_NO_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Native Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1 libegl1 libxkbcommon-x11-0
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio pytest-github-actions-annotate-failures
      - name: Run measured reliability matrix
        run: >-
          python -m pytest
          tests/test_action_dedup.py
          tests/test_action_safety.py
          tests/test_provider_routing.py
          tests/test_phase2_provider.py
          tests/test_long_tasks_hardening.py
          tests/test_session_recycle.py
          tests/test_live_answering_reliability.py
          tests/test_barge_in_echo.py
          tests/test_phase1_voice.py
          tests/test_skill_loader.py
          tests/test_desktop_shortcut.py
          tests/test_shortcut_startup_regression.py
          tests/test_update_manager.py
          tests/test_repository_privacy.py
          tests/test_program_completion.py
          --junitxml=reliability-results.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-evaluation-results
          path: reliability-results.xml
          retention-days: 30
